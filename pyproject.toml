[build-system]
requires = ["setuptools==75.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graded-roof-snow"
version = "0.1.0"
description = "Multi-objective simulation of spatially graded roofs for passive snow management"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "Tatsuki Onishi"}]
dependencies = [
  "matplotlib==3.9.2",
  "numpy==2.1.3",
  "pandas==2.2.3",
  "Pillow==11.0.0",
  "pymoo==0.6.1.3",
  "python-docx==1.1.2",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "scipy==1.14.1",
  "tifffile==2024.9.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3", "ruff==0.7.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
